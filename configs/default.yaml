# All relative paths are relative to the project folder.
competition: h-and-m-personalized-fashion-recommendations

paths:
  raw: data/raw
  interim: data/interim
  thumbs: data/thumbs          # 256-px thumbnails made from the competition images (never committed)
  models: models
  reports: reports

# Shared MLflow store for all ml-portfolio projects (SQLite + artifact folder)
tracking_uri: ../mlflow.db
artifact_root: ../mlruns
experiment: hm-fashion-recommender

# Weeks run Wednesday-Tuesday. Week 105 is Kaggle's hidden test week (2020-09-23..29),
# week 104 (2020-09-16..22) is the last week with known purchases and our validation week.
test_week_start: "2020-09-23"
valid_week: 104
train_weeks: [101, 102, 103]   # label weeks used to train the ranker for validation
history_weeks: 26              # features and candidates never look further back than this
k: 12

candidates:
  repurchase_weeks: 12         # a customer's own purchases in the last N weeks
  repurchase_max: 30
  popular_n: 48                # top-N of the last week, per age band
  cooccur_weeks: 6             # "bought in the same week" pairs from the last N weeks
  cooccur_neighbors: 24
  seed_items: 8                # most recent purchases used as seeds for co-purchase and similarity
  similar_neighbors: 6
  active_catalog_weeks: 4      # only recommend articles sold in the last N weeks

neg_sample_rate: 0.25          # share of negative candidates kept for training (all positives kept)
inference_batch: 150000        # customers per batch when scoring everyone

lgbm:
  objective: lambdarank
  metric: map
  eval_at: [12]
  learning_rate: 0.05
  num_leaves: 63
  min_data_in_leaf: 100
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
  lambdarank_truncation_level: 20
  num_threads: 10
  seed: 42
  verbose: -1
num_boost_round: 400

