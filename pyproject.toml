[project]
name = "hmrec"
version = "0.1.0"
description = "Two-stage fashion recommender on H&M (31M purchases): candidate generation (repurchase, age-band popularity, co-purchase, CLIP similarity) + LightGBM LambdaRank, MAP@12, API and demo."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Fares Ayman" }]
# Core = what the recommendation API needs at serving time.
dependencies = [
    "numpy>=2.0",
    "polars>=1.10",
    "pyarrow>=17",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
# data preparation, candidates, ranker, MLflow, reports
train = ["pandas>=2.2", "lightgbm>=4.5", "mlflow>=3.0", "pillow>=11"]
# CLIP image + text embeddings (GPU); not needed for tests or serving
embed = ["torch>=2.5", "transformers>=4.46", "pillow>=11"]
dashboard = ["streamlit>=1.40", "pillow>=11"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "kaggle>=1.6",
    "truststore>=0.10",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hmrec"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY", "PD", "RUF"]
# PD010/PD011: pandas-only rules that misfire on polars
ignore = ["PD010", "PD011", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=hmrec --cov-report=term-missing"
filterwarnings = ["ignore::DeprecationWarning"]
